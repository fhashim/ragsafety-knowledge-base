name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RAGSAFETY_MOCK_MODE: "true"
  PYTHONPATH: src

jobs:
  python:
    name: ruff + pytest (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src scripts eval demos tests
      - name: Generate synthetic data
        run: python scripts/generate_data.py
      - name: Pytest
        run: pytest -q

  terraform:
    name: terraform fmt/validate/tflint/checkov + plan
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - name: TFLint init
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Validate + lint each root
        run: |
          set -e
          for r in bootstrap platform app; do
            echo "== $r =="
            terraform -chdir="infra/$r" init -backend=false -no-color
            terraform -chdir="infra/$r" validate -no-color
            tflint --chdir="infra/$r" --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          done

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          config_file: infra/.checkov.yaml
          hard_fail_on: HIGH
          quiet: true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform plan (dev platform + app)
        id: plan
        run: |
          set -e
          terraform -chdir=infra/platform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=dev/platform.tfstate"
          terraform -chdir=infra/platform plan -no-color \
            -var-file=../envs/dev/dev.tfvars \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            | tee plan_platform.txt
        continue-on-error: true

      - name: Comment plan summary on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### Terraform plan (dev / platform)\n```\n';
            try {
              const txt = fs.readFileSync('plan_platform.txt', 'utf8');
              body += txt.slice(-5000);
            } catch (e) {
              body += 'Plan not available (missing cloud credentials?)';
            }
            body += '\n```';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
