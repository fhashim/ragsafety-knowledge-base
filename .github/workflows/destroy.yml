name: destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        options: [dev, prod]
        required: true
      confirm:
        description: Type the environment name to confirm
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  destroy:
    name: destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }} # requires environment approval
    steps:
      - name: Verify confirmation matches environment
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '${{ github.event.inputs.environment }}'." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy app stack
        run: |
          ENVIR="${{ github.event.inputs.environment }}"
          terraform -chdir=infra/app init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${ENVIR}/app.tfstate"
          terraform -chdir=infra/app destroy -auto-approve \
            -var-file="../envs/${ENVIR}/${ENVIR}.tfvars" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="image_tag=destroy" \
            -var="state_resource_group=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -var="state_storage_account=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -var="state_container=${{ vars.TF_STATE_CONTAINER }}" \
            -var="platform_state_key=${ENVIR}/platform.tfstate" || true

      - name: Destroy platform stack
        run: |
          ENVIR="${{ github.event.inputs.environment }}"
          terraform -chdir=infra/platform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${ENVIR}/platform.tfstate"
          terraform -chdir=infra/platform destroy -auto-approve \
            -var-file="../envs/${ENVIR}/${ENVIR}.tfvars" \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
