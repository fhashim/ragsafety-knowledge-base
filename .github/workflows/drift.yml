name: drift

on:
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  drift:
    name: drift (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Plan with detailed exit code
        id: drift
        run: |
          terraform -chdir=infra/platform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ matrix.env }}/platform.tfstate"
          set +e
          terraform -chdir=infra/platform plan -detailed-exitcode -no-color \
            -var-file=../envs/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Open issue on drift
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Infrastructure drift detected in ${{ matrix.env }}`,
              body: `Nightly \`terraform plan -detailed-exitcode\` reported drift in **${{ matrix.env }}**. See run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              labels: ['drift', '${{ matrix.env }}'],
            });

      - name: Fail if drift
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "Drift detected in ${{ matrix.env }}" >&2
          exit 1
