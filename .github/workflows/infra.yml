name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: "Also apply to prod (requires prod environment approval)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan-dev:
    name: plan (dev)
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: infra-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Init + plan
        run: |
          terraform -chdir=infra/platform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=dev/platform.tfstate"
          terraform -chdir=infra/platform plan -out=dev.tfplan \
            -var-file=../envs/dev/dev.tfvars \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: dev-platform-plan
          path: infra/platform/dev.tfplan

  apply-dev:
    name: apply (dev)
    needs: plan-dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: infra-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: dev-platform-plan
          path: infra/platform
      - name: Init + apply saved plan
        run: |
          terraform -chdir=infra/platform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=dev/platform.tfstate"
          terraform -chdir=infra/platform apply -auto-approve dev.tfplan

  apply-prod:
    name: apply (prod)
    needs: apply-dev
    # Prod NEVER deploys automatically. It runs only on a manual dispatch that
    # explicitly opts in (deploy_prod=true), AND still waits on the prod
    # environment's required-reviewer approval. This is defense in depth: prod is
    # not gated by the approval rule alone.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_prod }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: infra-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Init + plan + apply (prod)
        run: |
          terraform -chdir=infra/platform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=prod/platform.tfstate"
          terraform -chdir=infra/platform plan -out=prod.tfplan \
            -var-file=../envs/prod/prod.tfvars \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          terraform -chdir=infra/platform apply -auto-approve prod.tfplan
