name: ingest

on:
  push:
    branches: [main]
    paths:
      - "data/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PYTHONPATH: src

jobs:
  ingest:
    name: build index + ingest
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read platform outputs into env
        run: |
          ENVIR="${{ github.event.inputs.environment || 'dev' }}"
          terraform -chdir=infra/platform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${ENVIR}/platform.tfstate"
          cd infra/platform
          {
            echo "RAGSAFETY_MOCK_MODE=false"
            echo "RAGSAFETY_FOUNDRY_ENDPOINT=$(terraform output -raw foundry_endpoint)"
            echo "RAGSAFETY_SEARCH_ENDPOINT=$(terraform output -raw search_endpoint)"
            echo "RAGSAFETY_DOCINTEL_ENDPOINT=$(terraform output -raw docintel_endpoint)"
            echo "RAGSAFETY_STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)"
            echo "RAGSAFETY_MANAGED_IDENTITY_CLIENT_ID=$(terraform output -raw runtime_identity_client_id)"
          } >> "$GITHUB_ENV"

      - name: Build index schema
        run: python scripts/build_index.py --strategy section_aware

      - name: Ingest documents
        run: python scripts/ingest.py --strategy section_aware
