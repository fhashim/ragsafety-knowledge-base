# Token/compute pricing used to turn recorded token usage into cost.
# NEVER hard-code prices in source. These are PLACEHOLDERS.
# VERIFY: confirm current Azure OpenAI / Foundry list prices for your region
#         before trusting any cost number. Prices below are illustrative only.
#
# Units: USD per 1,000 tokens (prompt / completion), USD per 1,000 tokens for
# embeddings. "currency" is informational.

currency: USD
as_of: "2026-10-03"           # when these placeholders were entered
verify: true                  # surfaces a "prices unverified" warning in reports

models:
  gpt-4o:
    prompt_per_1k: 0.0025
    completion_per_1k: 0.0100
  gpt-4o-mini:
    prompt_per_1k: 0.00015
    completion_per_1k: 0.00060
  text-embedding-3-large:
    embedding_per_1k: 0.00013
  text-embedding-3-small:
    embedding_per_1k: 0.00002

# Fallback used when a deployment's model is unknown.
default:
  prompt_per_1k: 0.0025
  completion_per_1k: 0.0100
  embedding_per_1k: 0.00013
