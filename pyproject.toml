[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsafety"
version = "0.1.0"
description = "RAG safety-checklist prototype for energy field technicians on Microsoft Foundry"
requires-python = ">=3.11"
readme = "README.md"

# Runtime deps live in requirements.txt (pinned). This section keeps the package
# installable with `pip install -e .` for the console scripts below.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity",
  "azure-search-documents",
  "azure-ai-documentintelligence",
  "azure-ai-contentsafety",
  "azure-ai-projects",
  "azure-ai-evaluation",
  "azure-data-tables",
  "azure-storage-blob",
  "azure-monitor-opentelemetry",
  "openai",
]

[project.scripts]
ragsafety-generate-data = "scripts.generate_data:main"
ragsafety-build-index = "scripts.build_index:main"
ragsafety-ingest = "scripts.ingest:main"
ragsafety-cost-report = "scripts.cost_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "eval", "demos", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = [
  "E501",   # line length handled by formatter; long strings in data/prompts
  "UP042",  # `str, Enum` is an intentional, pydantic/JSON-friendly idiom here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Demos and eval/ scripts insert the repo on sys.path before importing ragsafety.
"demos/*" = ["E402"]
"eval/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
